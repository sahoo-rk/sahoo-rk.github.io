- position: DST-INSPIRE Faculty Fellow
  company: CSIR - Centre for Cellular and Molecular Biology (CCMB)
  description: |
    Population genomics of a biocontrol beetle species. Genome assembly and annotation using 
    short-read and long-read whole-genome sequences.  Genomic insights into Wolbachia symbiont 
    of the beetle species using genomics, phylogenomics, protein structure modelling and molecular 
    dynamics simulation.
  period: January 2021 - January 2026

- position: Post-Doctoral Research Fellow
  company: Indian Institute of Science Education and Research (IISER) Berhampur
  description: |
    Chemical basis of the ecological interaction between a beetle species and its host plant. Isolation 
    and crystallization of the active compound in the host plant. Chromatographic analysis of the active 
    compound through the beetle gut content.
  period: May 2019 - January 2021

