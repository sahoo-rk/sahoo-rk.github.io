about: 
Ranjit Kumar Sahoo is an INSPIRE Faculty Fellow at CSIR-CCMB, leading research in population genomics 
and insect–microbe ecology. He integrates molecular genetics, experimental biology, and bioinformatics 
to understand how demographic history and host–microbe interactions shape the evolution and resilience 
of insect populations. Trained in phylogenetics and biogeography during his PhD, he has advanced understanding 
of plant–insect interactions and insect–Wolbachia ecology. His recent work has appeared in journals of 
international scientific societies, including the American Society for Microbiology (ASM), 
the Society for Molecular Biology and Evolution (SMBE), and the Genetics Society of America (GSA), 
reflecting contributions across molecular ecology, evolutionary genomics, and host–symbiont dynamics. 
Looking ahead, he aims to explore the diversity and co‑evolution of microbial symbionts in insects using 
genomic inventories, experimental analyses, and co‑evolutionary modeling.
