about: |
  Ranjit Kumar Sahoo is an evolutionary ecologist whose research investigates how demographic history and 
  host–microbe interactions shape the evolution of insect populations. His work integrates population genomics, 
  comparative genomics, and experimental biology to examine the evolutionary consequences of 
  demographic bottlenecks and the ecological and genomic dynamics of insect–symbiont interactions. His research 
  has contributed to understanding butterfly diversification and plant–insect interactions, the population-genetic 
  consequences of introducing a biocontrol beetle, and the genomic diversity and structural evolution of Wolbachia 
  male-killing candidate genes. His recent work has appeared in journals of international scientific societies, 
  including the American Society for Microbiology (ASM), the Society for Molecular Biology and Evolution (SMBE), 
  and the Genetics Society of America (GSA). Building on this work, he aims to investigate how environmental conditions, 
  demographic processes, and microbial symbionts jointly influence insect evolution, integrating genomic analyses with 
  experimental approaches and evolutionary modelling.
